{% block main_view %}
<div class="main-view-container">

    <div id="main-view-wrapper">
        <div id="graph-canvas-container">
            <div id="plugin-content-area">
                {{ plugin_html | safe }}
            </div>
        </div>

        <!--  TEMPORARILY INJECTED FOR TESTING PURPOSES. BIRD VIEW SHOULD NOT STAY HERE IN THE FINAL SOLUTION !! !!  ! !!!  !! !  !! ! !       -->
        {% include 'bird-view.html' %}

        <div id="floating-tooltip" class="tooltip"></div>
    </div>

</div>

<style>
        .main-view-container {
            max-width: 1400px;
            margin: 0 auto;

            background: white;
            padding: 15px;
        }

        #main-view-wrapper {
            display: flex;

            width: 100%;
            height: 700px;

            border: 1px solid #ccc;
            border-radius: 4px;

            overflow: hidden;
            position: relative;
        }

        #graph-canvas-container {
            flex: 1;
            position: relative;
            background: #fdfdfd;
            cursor: grab;
        }

        #graph-canvas-container:active {
            cursor: grabbing;
        }

        .tooltip {
            font-family: system-ui;

            position: absolute;
            text-align: left;
            padding: 10px;

            font-size: 12px;

            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #333;
            border-radius: 5px;

            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            visibility: hidden;
            z-index: 9999;

            min-width: 180px;
        }

        .tooltip table {
            width: 100%;
            border-collapse: collapse;
        }

        .tooltip td {
            padding: 4px;
            border-bottom: 1px solid #eee;
        }

        .tooltip .key {
            font-weight: bold;
            color: #555;
            padding-right: 10px;
        }
</style>

<script>

        let zoomLayer = null;
        let currentTransform = d3.zoomIdentity;

        function waitForSvg() {
            const svgElement = document.querySelector("#graph-viewport svg");
            if (svgElement && svgElement.children.length > 0) {
                setupAdvancedFeatures(svgElement);
            } else {
                setTimeout(waitForSvg, 100);
            }
        }

        waitForSvg();

        function showTooltip(d, tooltip,element){
                if (!d) return;

                d3.select(element).select("circle, rect")
                    .transition().duration(150)
                    .style("stroke", "#007bff")
                    .style("stroke-width", "3px");

                const entries = Object.entries(d).filter(([key]) =>
                    !['x', 'y', 'vx', 'vy', 'index', 'fx', 'fy', 'source', 'target'].includes(key)
                );

                let html = '<table>';
                entries.forEach(([key, value]) => {
                    const displayVal = (typeof value === 'object') ? '...' : value;
                    html += `<tr><td class="key">${key}:</td><td>${displayVal}</td></tr>`;
                });
                html += '</table>';

                tooltip.html(html).style("visibility", "visible");
        }

        function setTooltipPosition(tooltip, event){
            tooltip.style("top", (event.pageY - 200) + "px").style("left", (event.pageX - 300) + "px");
        }

        function removeTooltip(tooltip, element){
            d3.select(element).select("circle, rect")
                .transition().duration(150)
                .style("stroke", "#333")
                .style("stroke-width", "1px");

            tooltip.style("visibility", "hidden");
        }


        function setupAdvancedFeatures(svgRaw) {
            const svg = d3.select(svgRaw);
            const tooltip = d3.select("#floating-tooltip");

            zoomLayer = svg.select(".zoom-layer");

            if (zoomLayer.empty()) {
                zoomLayer = svg.insert("g", ":first-child").attr("class", "zoom-layer");

                const children = Array.from(svgRaw.children);
                children.forEach(child => {
                    if (child !== zoomLayer.node()) {
                        zoomLayer.node().appendChild(child);
                    }
                });
            }

            const zoom = d3.zoom()
                .scaleExtent([0.1, 8])
                .on("zoom", (event) => {
                    currentTransform = event.transform;
                    zoomLayer.attr("transform", currentTransform);
                    BirdView.updateViewport(currentTransform);
                });

            svg.call(zoom);

            function syncLoop() {
                BirdView.updateContent(zoomLayer);
                BirdView.updateViewport(currentTransform);
                requestAnimationFrame(syncLoop);
            }
            syncLoop();

            const nodes = zoomLayer.selectAll("g");

            nodes.on("mouseenter", function(event, d) {
                showTooltip(d, tooltip, this)
            }).on("mousemove", function(event) {
                setTooltipPosition(tooltip, event)
            }).on("mouseleave", function() {
                removeTooltip(tooltip, this)
            });
        }
</script>
{% endblock %}
