<div id="bird-view-container">
    <svg id="bird-view-svg"></svg>
    <div id="bird-view-viewport"></div>
</div>

<style>
    #bird-view-container {
        position: absolute;
        bottom: 25px;
        right: 25px;
        width: 220px;
        height: 160px;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #444;
        border-radius: 6px;
        overflow: hidden;
        pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        z-index: 1000;
    }

    #bird-view-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

#bird-view-viewport {
        position: absolute;
        border: 2px solid #007bff;
        background: rgba(0, 123, 255, 0.1);
        top: 0;
        left: 0;
        pointer-events: none;
        box-sizing: border-box;
        transition: background-color 1s ease, border-color 1s ease;
    }
</style>

<script>

    function startColorCycle() {
        const viewport = document.getElementById("bird-view-viewport");

        setInterval(() => {
            const hue = Math.floor(Math.random() * 360);

            const borderColor = `hsla(${hue}, 70%, 50%, 1)`;
            const bgColor = `hsla(${hue}, 70%, 50%, 0.15)`;

            viewport.style.borderColor = borderColor;
            viewport.style.backgroundColor = bgColor;
        }, 500);
    }

    startColorCycle();

    window.BirdView = {
        config: {
            width: 220,
            height: 160,
            padding: 0.9
        },

        updateContent: function(mainZoomLayer) {
            if (!mainZoomLayer) return;

            const svg = d3.select("#bird-view-svg");
            const node = mainZoomLayer.node();

            const bbox = node.getBBox();

            if (bbox.width === 0 || bbox.height === 0) return;

            const bvWidth = 220;
            const bvHeight = 160;
            const padding = 20;

            const scale = Math.min(
                (bvWidth - padding) / bbox.width,
                (bvHeight - padding) / bbox.height
            );

            const tx = (bvWidth / 2) - (scale * (bbox.x + bbox.width / 2));
            const ty = (bvHeight / 2) - (scale * (bbox.y + bbox.height / 2));

            svg.html(node.innerHTML);

            svg.selectAll("*").attr("transform", null);
            svg.attr("viewBox", `0 0 ${bvWidth} ${bvHeight}`);

            svg.html(`<g transform="translate(${tx},${ty}) scale(${scale})">${node.innerHTML}</g>`);

            window._bv_meta = { scale, tx, ty, bvWidth, bvHeight };
        },

        updateViewport: function(transform) {
            const rect = document.getElementById("bird-view-viewport");
            const mainSvg = document.querySelector("#graph-viewport svg");
            const meta = window._bv_meta;

            if (!rect || !mainSvg || !meta) return;

            const rectBounds = mainSvg.getBoundingClientRect();
            const width = rectBounds.width;
            const height = rectBounds.height;

            const topLeft = transform.invert([0, 0]);
            const bottomRight = transform.invert([width, height]);

            const visibleGraphWidth = bottomRight[0] - topLeft[0];
            const visibleGraphHeight = bottomRight[1] - topLeft[1];

            const rectW = visibleGraphWidth * meta.scale;
            const rectH = visibleGraphHeight * meta.scale;

            const rectX = (topLeft[0] * meta.scale) + meta.tx;
            const rectY = (topLeft[1] * meta.scale) + meta.ty;

            rect.style.width = rectW + "px";
            rect.style.height = rectH + "px";
            rect.style.transform = `translate(${rectX}px, ${rectY}px)`;
        }
    };
</script>
