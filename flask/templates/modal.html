<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>

        <div class="modal-field">
          <label for="wsName">Workspace name:</label>
          <input type="text" id="wsName" placeholder="e.g. Workspace 2" autocomplete="off" />
        </div>

        <div class="modal-field">
          <div class="modal-file-row">
            <span>Load Graph</span>
            <button class="btn-file" onclick="document.getElementById('modalFile').click()">Choose File</button>
            <input type="file" id="modalFile" style="display:none" />
          </div>
        </div>

        <div class="modal-field">
          <select id="modalVisualizer">
            <option value="">Loading styles...</option>
          </select>
        </div>

        <div class="modal-actions">
          <button class="btn-dark" onclick="createWorkspace()">Create</button>
          <button class="btn-dark secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
</div>
